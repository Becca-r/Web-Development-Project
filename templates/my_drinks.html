{% if not drinks %}
  <p>You haven't saved any drinks yet!</p>
{% else %}
  <div id="saved-drink-recipe">
    <input class="form-control" type="search"
           name="drink_search" placeholder="Begin Typing To Search Drinks..."
           hx-post="/drink_search"
           hx-trigger="input changed delay:500ms, keyup[key=='Enter']"
           hx-target="#saved_drinks">

    <div id="saved_drinks">
      {% include "saved_drinks.html" %}
    </div>
  </div>
{% endif %}
